<!DOCTYPE html>
<html lang="de" class="dark-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fahrzeugkarte (Embed)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Eigene Styles (fuer Variablen/Popup-Design) -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Vollflaechige, einbettbare Karte - ohne Kopfzeile, ohne PIN */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    .leaflet-popup-content-wrapper {
      background: var(--sheet, #222); color: var(--ink, #fff);
      border: 1px solid var(--line, #444); border-radius: 10px;
    }
    .leaflet-popup-tip { background: var(--sheet, #222); }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Externe Bibliotheken -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Nur das Noetige: Daten, Konfig, Sync, Karte (kein app.js, keine PIN) -->
  <script src="data/gears.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script>window.FMS_MAP_AUTOFIT = true;  /* Embed: dauerhaft auf alle Einheiten zentrieren */</script>
  <script src="js/map.js"></script>
</body>
</html>
