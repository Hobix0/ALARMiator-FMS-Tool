<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FMS Tool – Kartenansicht</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Eigene Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0) + 10px) 16px 10px;
      background: var(--topbar, #1a1a1a);
      border-bottom: 2px solid var(--accent, #ff9800);
      color: var(--title, #ffffff);
    }

    .map-header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-back, .btn-geo {
      background: var(--sheet-2, #333333);
      color: var(--ink, #ffffff);
      border: 1px solid var(--line, #444444);
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back:active, .btn-geo:active {
      transform: translateY(1px);
    }

    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    .leaflet-popup-content-wrapper {
      background: var(--sheet, #222);
      color: var(--ink, #fff);
      border: 1px solid var(--line, #444);
      border-radius: 10px;
    }
    
    .leaflet-popup-tip {
      background: var(--sheet, #222);
    }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header class="map-header">
    <h1>Fahrzeugkarte</h1>
    <!-- Manuell Position setzen Button -->
  </header>

  <!-- Karte -->
  <div id="map"></div>

  <!-- PIN-Abfrage Overlay -->
  <div class="pin-backdrop" id="pinBackdrop">
    <div class="pin-card">
      <h3>PIN-Eingabe</h3>
      <p class="pin-hint">Bitte PIN eingeben, um fortzufahren.</p>

      <div class="pin-dots" id="pinDots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="pin-keypad">
        <button class="pin-btn" data-val="1">1</button>
        <button class="pin-btn" data-val="2">2</button>
        <button class="pin-btn" data-val="3">3</button>
        <button class="pin-btn" data-val="4">4</button>
        <button class="pin-btn" data-val="5">5</button>
        <button class="pin-btn" data-val="6">6</button>
        <button class="pin-btn" data-val="7">7</button>
        <button class="pin-btn" data-val="8">8</button>
        <button class="pin-btn" data-val="9">9</button>
        <button class="pin-btn del" id="btnPinClear">C</button>
        <button class="pin-btn" data-val="0">0</button>
        <button class="pin-btn ok" id="btnPinSubmit">✓</button>
      </div>
    </div>
  </div>

  <!-- Toast (z. B. bei falscher PIN) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Externe Bibliotheken -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Eigene Skripte in korrekter Reihenfolge -->
  <script src="data/gears.js"></script>
  <script src="js/config.js"></script>
  <script src="js/statuses.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>

  <script>
    /* Synchronisation des Themes mit abgesichertem Fallback */
    document.addEventListener("DOMContentLoaded", () => {
      try {
        const storageKey = (typeof FMS !== "undefined" && FMS.STORAGE_KEY) ? FMS.STORAGE_KEY : "fms_config";
        const raw = localStorage.getItem(storageKey);
        
        if (raw) {
          const cfg = JSON.parse(raw);
          const isDark = cfg.darkMode !== false;
          document.documentElement.classList.toggle("dark-mode", isDark);
        }
      } catch (e) {
        console.warn("Konnte Theme nicht aus Config laden:", e);
      }
    });
  </script>
</body>
</html>
